<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Mini Missions</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Kid Dashboard -->
    <div id="kid-view" class="view active">
        <header class="header">
            <h1>🎯 MINI MISSIONS</h1>
            <button class="mode-switch" onclick="switchToParent()">👨‍👩‍👧 Parent</button>
        </header>

        <div class="container">
            <div class="welcome">
                <h2>Hi, <span id="child-name">Alex</span>! 👋</h2>
            </div>

            <div class="coins-card">
                <h3>Your Coins</h3>
                <div class="coins-amount">🪙 <span id="coin-balance">0</span></div>
            </div>

            <div class="streak-card">
                <span class="streak-icon">🔥</span>
                <span>Streak: <strong id="streak-count">0</strong> days!</span>
            </div>

            <h3>Today's Missions:</h3>
            <div id="missions-list"></div>

            <button class="btn btn-primary btn-large" onclick="showView('rewards-view')">
                🎁 VIEW REWARDS
            </button>
        </div>
    </div>

    <!-- Parent Dashboard -->
    <div id="parent-view" class="view">
        <header class="header">
            <h1>👨‍👩‍👧 PARENT DASHBOARD</h1>
            <button class="mode-switch" onclick="showView('kid-view')">🎯 Kid View</button>
        </header>

        <div class="container">
            <div class="stats-summary">
                <div class="stat-item">
                    <div class="stat-value" id="pending-count">0</div>
                    <div class="stat-label">Pending Approvals</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="weekly-completed">0</div>
                    <div class="stat-label">Completed This Week</div>
                </div>
            </div>

            <div class="pending-section" id="pending-section">
                <h3>⏰ Pending Approvals</h3>
                <div id="pending-list"></div>
            </div>

            <div class="quick-actions">
                <button class="btn btn-primary" onclick="showView('create-mission-view')">
                    ➕ CREATE MISSION
                </button>
                <button class="btn btn-secondary" onclick="showView('manage-rewards-view')">
                    🎁 MANAGE REWARDS
                </button>
            </div>

            <h3>All Missions:</h3>
            <div id="parent-missions-list"></div>
        </div>
    </div>

    <!-- Create Mission View -->
    <div id="create-mission-view" class="view">
        <header class="header">
            <button class="back-btn" onclick="showView('parent-view')">← BACK</button>
            <h1>CREATE MISSION</h1>
        </header>

        <div class="container">
            <form id="create-mission-form" class="form">
                <div class="form-group">
                    <label>Mission Name:</label>
                    <input type="text" id="mission-name" required placeholder="e.g., Make your bed">
                </div>

                <div class="form-group">
                    <label>Coin Reward: 🪙</label>
                    <input type="number" id="mission-coins" value="5" min="1" required>
                </div>

                <div class="form-group">
                    <label>Difficulty:</label>
                    <select id="mission-difficulty">
                        <option value="easy">Easy (5-10 min)</option>
                        <option value="medium">Medium (15-30 min)</option>
                        <option value="hard">Hard (1+ hour)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Repeat:</label>
                    <select id="mission-repeat">
                        <option value="once">One-time</option>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-large">
                    CREATE MISSION
                </button>
            </form>
        </div>
    </div>

    <!-- Rewards Store View -->
    <div id="rewards-view" class="view">
        <header class="header">
            <button class="back-btn" onclick="showView('kid-view')">← BACK</button>
            <h1>🎁 REWARDS STORE</h1>
        </header>

        <div class="container">
            <div class="your-coins">
                You have: 🪙 <span id="rewards-coins">0</span>
            </div>

            <div id="rewards-list"></div>
        </div>
    </div>

    <!-- Manage Rewards View -->
    <div id="manage-rewards-view" class="view">
        <header class="header">
            <button class="back-btn" onclick="showView('parent-view')">← BACK</button>
            <h1>MANAGE REWARDS</h1>
        </header>

        <div class="container">
            <form id="add-reward-form" class="form">
                <h3>Add New Reward</h3>

                <div class="form-group">
                    <label>Reward Name:</label>
                    <input type="text" id="reward-name" required placeholder="e.g., Ice cream trip">
                </div>

                <div class="form-group">
                    <label>Cost: 🪙</label>
                    <input type="number" id="reward-cost" value="25" min="1" required>
                </div>

                <div class="form-group">
                    <label>Type:</label>
                    <select id="reward-type">
                        <option value="treat">🍦 Treat</option>
                        <option value="toy">🎮 Toy</option>
                        <option value="activity">🎉 Activity</option>
                        <option value="screen-time">📱 Screen Time</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">ADD REWARD</button>
            </form>

            <h3>Current Rewards:</h3>
            <div id="current-rewards-list"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
